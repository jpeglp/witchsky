name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest # or macos-26-xlarge if Xcode 26 needed
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 5

      - uses: pnpm/action-setup@v6

      - name: 🔧 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 🪛 Setup jq
        uses: dcarbone/install-jq-action@v2

      - name: ⚙️ Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable" # use whatever matches the repo's requirements

      - name: ☕️ Setup Cocoapods
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: 1.16.2

      - name: 🔤 Compile translations
        run: pnpm intl:build

      - name: ✏️ Write environment variables
        run: |
          # Minimal .env — omit secrets that aren't needed for a local build
          echo "EXPO_PUBLIC_RELEASE_VERSION=$(jq -r '.version' package.json)" >> .env
          echo "EXPO_PUBLIC_BUNDLE_IDENTIFIER=$(git rev-parse HEAD)" >> .env
          echo "EXPO_PUBLIC_BUNDLE_DATE=$(date -u +"%y%m%d%H")" >> .env

      # This generates the ios/ native project without building or signing
      - name: 🏗️ Prebuild (generate native iOS project via Expo)
        run: npx expo prebuild --platform ios --no-install

      # Copy assets but exclude .aiff from being placed where Xcode might try to compile them.
      - name: 🔧 Copy assets into generated iOS directory (exclude .aiff)
        run: |
          # copy everything except .aiff files into the iOS project root
          rsync -av --exclude='*.aiff' assets/ ios/Witchsky/
          # ensure audio files are placed in Resources (Xcode will treat these as resources instead of compile inputs)
          mkdir -p ios/Witchsky/Resources
          rsync -av --include='*.aiff' --exclude='*' assets/ ios/Witchsky/Resources/

      # Patch the generated Podfile to force SWIFT_VERSION and avoid treating pod warnings as errors.
      - name: 🔧 Patch generated ios/Podfile to set SWIFT_VERSION for pods
        run: |
          set -e
          PODFILE="ios/Podfile"
          if [ -f "$PODFILE" ]; then
            echo "Appending post_install hook to $PODFILE"
            cat >> "$PODFILE" <<'RUBY'

post_install do |installer|
  installer.pods_project.targets.each do |target|
    target.build_configurations.each do |config|
      # Force pods to use a compatible Swift version (adjust if you use a different Swift version)
      config.build_settings['SWIFT_VERSION'] = '5.9'
      # Prevent pods from failing the build due to treating warnings as errors
      config.build_settings['GCC_TREAT_WARNINGS_AS_ERRORS'] = 'NO'
    end
  end
end

RUBY
          else
            echo "$PODFILE not present; skipping Podfile patch"
          fi

      - name: 📦 Install Pods
        run: |
          cd ios
          pod install

      - name: 🔍 Debug - list ios directory
        run: ls -la ios/

      # Additional safety: list any .aiff files in ios and optionally delete them if still present.
      - name: 🔧 Ensure no stray .aiff are mis-processed
        run: |
          echo "Listing .aiff files found under ios/:"
          find ios -name '*.aiff' -print || true
          # If you prefer to remove them in CI, uncomment the following line:
          # find ios -name '*.aiff' -delete || true

      - name: 🔨 Archive (no code signing)
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/Witchsky.xcworkspace \
            -scheme Witchsky \
            -archivePath $RUNNER_TEMP/Witchsky.xcarchive \
            -sdk iphoneos \
            -arch arm64 \
            -configuration Release \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: 📦 Upload RUNNER_TEMP for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-temp-debug
          path: ${{ runner.temp }}/

      - name: 🔍 Debug - list xcarchive contents
        run: find $RUNNER_TEMP/Witchsky.xcarchive -type d

      - name: 📦 Package unsigned IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r "$RUNNER_TEMP/Witchsky.xcarchive/Products/Applications/Witchsky.app" \
            $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r Witchsky.ipa Payload/

      - name: ⬆️ Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Witchsky-ios.ipa
          path: ${{ runner.temp }}/Witchsky.ipa
